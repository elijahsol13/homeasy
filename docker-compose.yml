services:
  # ─── Independent verified SQLite snapshots ───────────────────────────────────
  # This process runs even when scraping is paused or blocked by a challenge.
  # The mounted directory is shared with the app; S3 comes in a later phase.
  backup:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runner
    container_name: homeasy-backup
    restart: unless-stopped
    stop_grace_period: 120s
    command: node dist/database/backup-worker.js
    environment:
      - NODE_ENV=production
      - HOMEASY_DEPLOYMENT_ROLE=vps
      - DATABASE_PATH=/app/data/homeasy.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "dist/database/backup-worker.js", "--health"]
      interval: 30m
      timeout: 15s
      retries: 2
      start_period: 5m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Telegram Bot Service (grammY) ──────────────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runner
    container_name: homeasy-bot
    restart: unless-stopped
    stop_grace_period: 60s
    command: npm run start:bot
    environment:
      - NODE_ENV=production
      - HOMEASY_DEPLOYMENT_ROLE=vps
      - DATABASE_PATH=/app/data/homeasy.db
      - SERVICE_TYPE=bot
      - LISTING_READ_PATH=canonical
      - CANONICAL_READ_CANARY_TELEGRAM_IDS=
      - CANONICAL_ALERTS_ENABLED=true
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── VPS Khmer24-only scraper; Facebook always runs on the Mac ──────────────
  scraper:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: homeasy-scraper
    restart: unless-stopped
    # Long grace period: VACUUM INTO backups and full-table enrichment scans are
    # synchronous (node:sqlite) and can exceed Docker's 10s default, causing
    # SIGKILL mid-write and SQLite corruption ("database disk image is malformed").
    stop_grace_period: 120s
    command: npm run start:scraper:vps
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/homeasy.db
      - SERVICE_TYPE=scraper
      - HOMEASY_DEPLOYMENT_ROLE=vps
      - LISTING_READ_PATH=canonical
      - CANONICAL_READ_CANARY_TELEGRAM_IDS=
      - CANONICAL_ALERTS_ENABLED=true
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ─── Telegram Mini App Fastify API ──────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runner
    container_name: homeasy-api
    restart: unless-stopped
    stop_grace_period: 30s
    command: npm run start:api
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - HOMEASY_DEPLOYMENT_ROLE=vps
      - DATABASE_PATH=/app/data/homeasy.db
      - API_PORT=3000
      - API_HOST=0.0.0.0
      - LISTING_READ_PATH=canonical
      - CANONICAL_READ_CANARY_TELEGRAM_IDS=
      - CANONICAL_ALERTS_ENABLED=true
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Cloudflare Tunnel → api.rustycat.cc ────────────────────────────────────
  # Locally-managed named tunnel. Credentials JSON lives in deploy/cloudflared/
  # (gitignored). On a new host: copy the *.json cred file + config.yml, then
  # `cloudflared tunnel route dns homeasy-api api.rustycat.cc` is already done.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: homeasy-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./deploy/cloudflared:/etc/cloudflared:ro
    depends_on:
      - api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
