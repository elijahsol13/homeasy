services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    shm_size: '512m'
    mem_limit: 450m
    memswap_limit: 450m
    deploy:
      resources:
        limits:
          memory: 450m
    env_file: .env
    volumes:
      - ./data:/app/data
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'


