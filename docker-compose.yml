services:
  # ─── Telegram Bot Service (grammY) ──────────────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homeasy-bot
    restart: unless-stopped
    stop_grace_period: 60s
    command: npm run start:bot
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/homeasy.db
      - SERVICE_TYPE=bot
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 200M
    mem_limit: 200m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Playwright Headless Scraper Worker ─────────────────────────────────────
  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homeasy-scraper
    restart: unless-stopped
    # Long grace period: VACUUM INTO backups and full-table enrichment scans are
    # synchronous (node:sqlite) and can exceed Docker's 10s default, causing
    # SIGKILL mid-write and SQLite corruption ("database disk image is malformed").
    stop_grace_period: 120s
    command: npm run start:scraper
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/homeasy.db
      - SERVICE_TYPE=scraper
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 750M
    mem_limit: 750m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ─── Telegram Mini App Fastify API ──────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homeasy-api
    restart: unless-stopped
    stop_grace_period: 30s
    command: npm run start:api
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/homeasy.db
      - API_PORT=3000
      - API_HOST=0.0.0.0
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 350M
    mem_limit: 350m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
